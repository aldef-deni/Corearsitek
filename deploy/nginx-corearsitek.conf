# ================================================================
# CoreArsitek — nginx vhost untuk corearsitek.aldeftech.com
#
# Pasang di server:
#   sudo cp deploy/nginx-corearsitek.conf /etc/nginx/sites-available/corearsitek.aldeftech.com
#   sudo ln -sfn /etc/nginx/sites-available/corearsitek.aldeftech.com \
#                /etc/nginx/sites-enabled/corearsitek.aldeftech.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sertifikat HTTPS dipasang belakangan lewat:
#   sudo certbot --nginx -d corearsitek.aldeftech.com
# (certbot akan menambahkan sendiri blok listen 443 + redirect)
# ================================================================

server {
    listen 80;
    listen [::]:80;
    server_name corearsitek.aldeftech.com;

    root /var/www/corearsitek/public;
    index index.php index.html;

    charset utf-8;

    # Ukuran unggahan gambar galeri (lihat batas 5MB di ContentController).
    client_max_body_size 12M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Aset statis di-cache lama; nama file CSS/JS sudah dibubuhi ?v=filemtime.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|avif|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Sesuaikan versi PHP-FPM yang terpasang di server.
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Jangan sajikan berkas tersembunyi (.env, .git, dsb).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/corearsitek.access.log;
    error_log  /var/log/nginx/corearsitek.error.log;
}
